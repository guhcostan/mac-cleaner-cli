recommendation_review:
- id: A1
  severity: P0
  topic: Tracked contents
  previous: Recommend accepting tracked-file deletion as a documented limitation.
  recommendation: Keep tracked-content protection using batched index plus HEAD inventory;
    ignore matching is a separate signal for generic names.
  reason: Per-candidate git check-ignore cost is not the only design available; staged
    removals need HEAD protection.
  evidence:
  - E20
  - E21
  - E22
  - E23
  requirements:
  - SR2
  - SR3
  - SR4
- id: A2
  severity: P0
  topic: Category/risk defaults
  previous: Separate category was an unresolved choice; new safety levels/default
    behavior unspecified.
  recommendation: Separate risky node-build-artifacts, opt-in risky go-artifacts and
    moderate rust-artifacts; prevent new categories entering unattended desktop cleaning.
  reason: Adding a moderate category changes default deep selection and allowed automatic
    categories.
  evidence:
  - E11
  - E12
  requirements:
  - FR3
  - FR5
  - SR8
- id: A3
  severity: P0
  topic: Excluded descendants
  previous: Exclude matched candidate directories and prune traversal.
  recommendation: Veto an ancestor artifact if any descendant is excluded.
  reason: Deleting dist would otherwise delete an excluded dist/keep.txt.
  evidence:
  - E2
  - E13
  requirements:
  - FR8
  - SR10
- id: A4
  severity: P0
  topic: Dry-run parity
  previous: Call scanner.clean in dry-run and assume equivalent validation.
  recommendation: Also run existence/type and protected-path checks in filesystem/backup
    preflight; avoid ensureBackupDir in dry-run.
  reason: Lower-level backup and remove paths have additional parity gaps.
  evidence:
  - E3
  - E13
  - E14
  - E15
  requirements:
  - SR6
  - FR11
- id: A5
  severity: P0
  topic: Replacement and symlink ancestry
  previous: Re-scan and reject replaced paths, without a mechanism to distinguish
    a new directory at the same path.
  recommendation: Record dev/ino identity and root binding; lstat candidate before
    realpath and check ancestors.
  reason: Canonical path plus category hash cannot prove directory identity or prevent
    ancestor redirection.
  evidence:
  - E2
  - E13
  requirements:
  - SR5
  - SR9
  - FR10
- id: A6
  severity: P1
  topic: Root config and external backup
  previous: extraPaths.projects replaces defaults; one-off CLI root is deferred.
  recommendation: Preserve additive extraPaths semantics, add repeatable --root override,
    and reject external backup paths in both dry/real execution.
  reason: Config key/init use extras; backup format only restores HOME-relative paths.
  evidence:
  - E1
  - E4
  - E14
  requirements:
  - FR7
  - FR11
- id: A7
  severity: P1
  topic: Age and timestamps
  previous: Preserve parent-only project age; newest regular-file mtime only.
  recommendation: Tighten node_modules age using newest entry mtime and include root/descendant
    directory mtimes in metadata.
  reason: Editing existing files does not reliably update parent-directory mtime;
    Go metadata includes directories.
  evidence:
  - E1
  - E18
  - E24
  requirements:
  - SR7
  - FR14
- id: A8
  severity: P1
  topic: Execution context
  previous: Wire validator into BaseScanner.clean without specifying how roots/opt-in
    options survive to clean.
  recommendation: Add optional clean context, preserve immutable selected scan policy,
    and refresh current safety facts.
  reason: Singleton scanners and desktop no-options calls make hidden last-scan state
    unsafe.
  evidence:
  - E2
  - E7
  - E16
  requirements:
  - FR10
  - FR12
  - FR18
- id: A9
  severity: P1
  topic: Dedupe timing
  previous: Drop descendants across candidates without category-selection semantics.
  recommendation: Keep independently selectable cross-category scan rows; dedupe selected
    eligible paths at execution.
  reason: An unselected worktree parent must not hide selected node_modules contents.
  evidence:
  - E1
  - E7
  - E16
  requirements:
  - FR9
- id: A10
  severity: P1
  topic: Scope completeness
  previous: Streaming/live review and positional/explicit roots were deferred outside
    the core plan.
  recommendation: Include explicit root flags and a bounded streaming/live-review
    implementation slice.
  reason: The user requested the complete implementation plan for the reported functionality.
  evidence:
  - E4
  - E18
  requirements:
  - FR7
  - FR16
  - FR17
- id: A11
  severity: P2
  topic: Metadata and identity accuracy
  previous: Go scan results described as generally exposing file count/newest mtime;
    desktop described as using path keys.
  recommendation: Distinguish Go core JSON from live helpers and retain host path
    selection without claiming desktop has an item-key scheme.
  reason: Those details were broader than observed source evidence.
  evidence:
  - E18
  - E25
  requirements:
  - FR14
  - FR15
- id: A12
  severity: P1
  topic: Planning artifact validity
  previous: YAML/JSON parsing treated as sufficient validation; duplicate readiness
    and unresolved completed dependencies remained.
  recommendation: Add duplicate-key detection, reference/coverage checks and a consistent
    readiness gate.
  reason: Syntactically valid artifacts can still discard state or contradict their
    tracker.
  evidence:
  - E26
  requirements:
  - OR4
confirmed_recommendations:
- Keep the existing node_modules scanner instead of adding a duplicate.
- Immediate-parent ecosystem markers for repo artifacts.
- Go opt-in separate from risky enablement.
- Shared rules/walker/eligibility modules with existing config authority.
- Revalidate selected candidates for every clean entrypoint.
- Retain backup/restore and explicit confirmation; do not port unchecked Go TUI cleanup.
- Retain optional path-derived IDs and measure before native discovery optimization.
implementation_readiness:
  status: ready
  blocking_items: []
  notes: Ready for the audit-recommended design; proposals are explicit and evidence-backed.
    This audit does not count as user approval or implementation verification.
residual_risks:
- Concurrent changes after final checks remain possible; no atomic deletion claim.
- Ignore rules and familiar marker/name combinations are practical signals, not proof
  every untracked file is disposable.
- Non-Git generic names are deliberately omitted.
- Git/query and full candidate-inspection costs need measurement during implementation;
  no speed claims are made.
- Desktop per-item deletion is not redesigned; risky-category confirmation and explicit
  category choice remain the desktop controls.
