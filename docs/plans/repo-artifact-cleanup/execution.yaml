performance:
  command: bun run benchmark:repo
  evidence: performance.json
  runtime: Bun 1.4.3 on darwin arm64
  candidates: [30, 300, 1500]
  nonoverlap_scan_ms: [63.7, 549.4, 3628.8]
  overlap_scan_ms: [66.7, 515.9, 3644.4]
  nonoverlap_selected_validation_ms: [79.8, 578.7, 4039.7]
  worktrees: [1, 5, 25]
  scan_git_processes: [6, 30, 150]
  selected_validation_git_processes: [11, 55, 275]
  interpretation: Each candidate tree is inspected once per scan, including overlapping roots. Selected validation separately refreshes two category batches; Git queries scale per worktree/batch, not per candidate.
  limits: Single ordered sample per variant; fixture setup excluded; 128-byte files; sampled process RSS includes baseline and excludes Git child RSS; warm-cache/order effects remain. These are measurements, not production throughput claims.
  optimization_decision: No additional discovery backend or cross-run cache; retain measured shared walk and request-local Git batching.

observations:
  - Existing filesystem socket tests require sandbox escalation; passed with temporary fixtures.
  - Existing controller freshness timeout is 15 minutes (audit text said five); preserved actual contract.
  - Integrated review found newly configured roots could rebase keep patterns and depth checks; three regression cases first failed, then passed after applying current root provenance without broadening original identity authority.
  - Live command tests separately verify final confirmation and exact selected context; desktop fixture tests exercise preview-to-validation and permanent deletion despite CLI backupEnabled.
  - All destructive product tests used temporary fixtures; external-tool cleanup was mocked. No user repository or home cleanup was performed.
  - Historical planning/audit findings are preserved; this tracker records the subsequently authorized implementation and validation.
remaining_limitations:
  - Filesystem/Git validation is not atomic with mutation; there is no active-build detection.
  - Size and freed-space values are logical estimates, not measured physical disk blocks.
  - Ambiguous generic outputs in non-Git projects remain intentionally ineligible.
  - Git queries fail closed at the documented 10-second timeout or 16-MiB combined output limit.
