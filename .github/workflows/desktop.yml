name: Desktop App

on:
  push:
    branches: [main, master]
    paths:
      - 'desktop/**'
      - 'src/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'desktop/**'
      - 'src/**'
      - '.github/workflows/desktop.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install CLI dependencies
        run: bun install

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install

      - name: Type check
        working-directory: desktop
        run: bun run typecheck

      - name: Test
        working-directory: desktop
        run: bun run test

      - name: Build app (.dmg / .zip)
        working-directory: desktop
        run: bun run dist
        env:
          # Optional: set these repository secrets to ship a signed and notarized app.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-cleaner-desktop
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" desktop/release/*.dmg desktop/release/*.zip --clobber
