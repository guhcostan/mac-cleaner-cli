name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test with coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.node-version == 20
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: bun run build

      - name: Test CLI
        run: |
          node dist/index.mjs --help
          node dist/index.mjs categories
          node dist/index.mjs scan --help
          node dist/index.mjs clean --help
          node dist/index.mjs app install --help

      # Installs the menu bar app from the latest release with both installers, on a real
      # Mac, and checks it ends up intact, validly signed (ad-hoc) and without quarantine.
      - name: Test app installers
        if: matrix.node-version == 22
        env:
          MAC_CLEANER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          check_app() {
            app="$1/Mac Cleaner.app"
            test -x "$app/Contents/MacOS/Mac Cleaner"
            codesign --verify --deep --strict "$app"
            if xattr -p com.apple.quarantine "$app" 2>/dev/null; then
              echo "quarantine attribute is set on $app"; exit 1
            fi
            echo "OK: $app"
          }

          node dist/index.mjs app install --no-open --dir "$RUNNER_TEMP/cli-apps"
          check_app "$RUNNER_TEMP/cli-apps"

          MAC_CLEANER_NO_OPEN=1 MAC_CLEANER_INSTALL_DIR="$RUNNER_TEMP/script-apps" bash docs/install.sh
          check_app "$RUNNER_TEMP/script-apps"

  publish:
    needs: test
    runs-on: macos-latest
    if: github.event_name == 'release'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
